name: Run all checks on Kedro Starters

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{inputs.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: make install-test-requirements
      - name: Run Bandit
        run: bandit -ll -r .

  run-tests:
    strategy:
      matrix:
        os: [ windows-latest , ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # One cache per job and Python version, so parallel matrix jobs don't race to save the same key.
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}
      - name: Install test requirements
        run: uv pip install --system -r test_requirements.txt
      - name: Set up Java 17 for Spark 4
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Hadoop native binaries for Spark on Windows
        if: runner.os == 'Windows'
        run: |
          # No winutils build exists for Spark 4's bundled Hadoop 3.5; 3.3.6 is the latest community build.
          $base = "https://raw.githubusercontent.com/cdarlint/winutils/7386986d5d8a079b5cd4464f4599766dd27e7d13/hadoop-3.3.6/bin"
          New-Item -ItemType Directory -Force -Path C:\hadoop\bin | Out-Null
          Invoke-WebRequest "$base/winutils.exe" -OutFile C:\hadoop\bin\winutils.exe
          Invoke-WebRequest "$base/hadoop.dll" -OutFile C:\hadoop\bin\hadoop.dll
          "HADOOP_HOME=C:\hadoop" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV
          "C:\hadoop\bin" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - name: Run `kedro run` end to end tests for all starters
        run: behave features/run.feature features/tools.feature features/test.feature

  lint:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{inputs.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # One cache per job and Python version, so parallel matrix jobs don't race to save the same key.
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}
      - name: Install test requirements
        run: uv pip install --system -r test_requirements.txt
      - name: Run linter for all starters
        run: behave features/lint.feature

  package:
    strategy:
      matrix:
        os: [ windows-latest , ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # One cache per job and Python version, so parallel matrix jobs don't race to save the same key.
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}
      - name: Install test requirements
        run: uv pip install --system -r test_requirements.txt
      - name: Set up Java 17 for Spark 4
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Hadoop native binaries for Spark on Windows
        if: runner.os == 'Windows'
        run: |
          # No winutils build exists for Spark 4's bundled Hadoop 3.5; 3.3.6 is the latest community build.
          $base = "https://raw.githubusercontent.com/cdarlint/winutils/7386986d5d8a079b5cd4464f4599766dd27e7d13/hadoop-3.3.6/bin"
          New-Item -ItemType Directory -Force -Path C:\hadoop\bin | Out-Null
          Invoke-WebRequest "$base/winutils.exe" -OutFile C:\hadoop\bin\winutils.exe
          Invoke-WebRequest "$base/hadoop.dll" -OutFile C:\hadoop\bin\hadoop.dll
          "HADOOP_HOME=C:\hadoop" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV
          "C:\hadoop\bin" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - name: Package and run all starters
        run: behave features/package.feature
