name: Label Community Issues

on:
  issues:
    types:
      - opened

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check if issue author is a member of Kedro org
        uses: actions/github-script@v6
        id: membership
        with:
          github-token: ${{ secrets.ORG_MEMBERSHIP_TOKEN }}
          result-encoding: string
          script: |

            try {
              const result = await github.rest.orgs.getMembershipForUser({
                       org: "kedro-org",
                       username: '${{ github.actor }}'
                    })

              console.log(result?.data?.state)
              if (result?.data?.state == "active"){
                console.log("%s: detected as an active member of Kedro org", '${{ github.actor }}')
                return "member";
              } else {
                console.log("%s: not detected as active member of Kedro org", '${{ github.actor }}')
                return "notMember";
              }

            } catch (error) {
              // A 404 means the user is not an org member. Any other error (e.g. a bad or
              // expired token) must not label the issue, so fail the job visibly instead.
              if (error.status === 404) {
                console.log("%s: not a member of Kedro org", '${{ github.actor }}')
                return "notMember";
              }
              core.setFailed(`Membership check failed: ${error.message}`)
              return "error";
            }

      - name: Label issue if author is from community
        if: ${{ steps.membership.outputs.result == 'notMember' }}
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: 'Community'
